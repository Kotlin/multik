name: Build & Test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build tools
        run: brew install gcc cmake

      - name: Set GCC environment
        run: |
          GCC_PREFIX=$(brew --prefix gcc)
          GCC_VER=$(ls "$GCC_PREFIX/bin/" | grep -oE 'gcc-[0-9]+' | head -1 | sed 's/gcc-//')
          echo "CMAKE_C_COMPILER=gcc-${GCC_VER}" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER=g++-${GCC_VER}" >> $GITHUB_ENV
          echo "GCC_LIB_Path=${GCC_PREFIX}/lib/gcc/current" >> $GITHUB_ENV

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 14
