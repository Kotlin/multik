name: Build & Test

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CMAKE_C_COMPILER: gcc-15
  CMAKE_CXX_COMPILER: g++-15
  GCC_LIB_Path: /usr/lib/gcc/x86_64-linux-gnu/15

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt update
          sudo apt install -y gcc-15 g++-15 gfortran-15 cmake

      - name: Set gcc-15 as default
        run: |
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 150
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 150
          sudo update-alternatives --install /usr/bin/gfortran gfortran /usr/bin/gfortran-15 150

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 14
