def cmakePath = "${rootDir}/multik-openblas/multik_jni"
def cmakeBuildDir = layout.buildDirectory.dir("cmake-build").get().asFile.absolutePath

String getTargetOSAndArch() {
    String hostOs = System.getProperty('os.name').toLowerCase()
    String hostArch = System.getProperty('os.arch').toLowerCase()
    if (hostOs == "mac os x" && hostArch == "x86_64")
        return 'macosX64'
    else if (hostOs == "mac os x" && hostArch == "aarch64")
        return 'macosArm64'
    else if (hostOs == "linux")
        return 'linuxX64'
    else if (hostOs.startsWith("windows"))
        return 'mingwX64'
    else
        throw GradleException("""
        Failed to detect platform. Please use the following platforms:
            macosX64
            macosArm64
            linuxX64
            mingwX64 (Windows X64 with mingw)
        Or specify explicitly, for example `export androidArm64`
                """)
}

def targetOS = System.getenv("TARGET_OS") ?: getTargetOSAndArch()

def cmakeCCompiler = System.getenv("CMAKE_C_COMPILER") ?: ""
def cmakeCxxCompiler = System.getenv("CMAKE_CXX_COMPILER") ?: ""
def gccLibPath = System.getenv("GCC_LIB_Path") ?: ""

static boolean isWindows() {
    return System.getProperty('os.name').toLowerCase().contains('windows')
}

tasks.register('createBuildDir') {
    description = 'Creates CMake build directories'
    doLast {
        layout.buildDirectory.get().asFile.mkdirs()
        layout.buildDirectory.dir("cmake-build").get().asFile.mkdirs()
    }
}

tasks.register('configureCmake', Exec) {
    description = 'Configures CMake project for native JNI build'
    group = 'build'
    dependsOn createBuildDir

    def args = [
            "cmake",
            "-DCMAKE_BUILD_TYPE=Release",
            "-DCMAKE_C_COMPILER=$cmakeCCompiler",
            "-DCMAKE_CXX_COMPILER=$cmakeCxxCompiler",
            "-DGCC_LIB_PATH=$gccLibPath",
            "-DTARGET_OS=$targetOS",
            "-S", cmakePath,
            "-B", cmakeBuildDir
    ]
    if (isWindows()) {
        args.addAll(["-G", "CodeBlocks - MinGW Makefiles"])
    }

    println(args)
    commandLine args
}

tasks.register('compileCmake', Exec) {
    description = 'Builds native JNI library with CMake'
    group = 'build'
    dependsOn configureCmake

    def processors = Runtime.getRuntime().availableProcessors().toString()
    commandLine "cmake", "--build", cmakeBuildDir, "--target", "multik_jni-$targetOS", "--", "-j", processors
}

tasks.register('copyNativeLibs', Copy) {
    description = 'Copies compiled native libraries to the libs directory'
    group = 'build'
    dependsOn compileCmake
    from(cmakeBuildDir)
    include("*.dylib", "*.so", "*.dll")
    into(layout.buildDirectory.dir("libs"))
}

// Lifecycle task — preserves the original name referenced by multik-openblas/build.gradle.kts
tasks.register('build_cmake') {
    description = 'Builds native JNI library and copies artifacts'
    group = 'build'
    dependsOn copyNativeLibs
}